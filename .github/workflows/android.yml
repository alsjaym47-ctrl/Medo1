 name: Build M Studio APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p extracted/OfflineAudioStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Studio-APK
          path: extracted/OfflineAudioStudio/app/build/outputs/apk/debug/*.apk
