name: Build M Studio APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p extracted/OfflineAudioStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Studio-APK
          path: extracted/OfflineAudioStudio/app/build/outputs/apk/debug/*.apk
